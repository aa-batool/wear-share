<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payouts — WearShare Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

  <header class="admin-topbar">
    <div class="wrap">
      <div class="wordmark">WearShare<small>admin</small></div>
      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="listings.html">Listings</a>
        <a href="orders.html">Orders</a>
        <a href="payouts.html" class="active">Payouts</a>
      </nav>
      <a href="login.html" class="admin-signout">Sign out</a>
    </div>
  </header>

  <main class="admin-main">
    <div class="wrap">
      <h1 class="admin-heading">Payouts</h1>
      <p class="admin-subheading">What's owed to providers once their items rent or sell.</p>

      <div class="payout-summary tag" id="payout-summary"></div>

      <div class="filters">
        <div class="filter-field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
          </select>
        </div>
        <span class="result-count" id="result-count"></span>
        <a class="detail-btn export-link" href="/api/admin/export/payouts" download>Export all to spreadsheet</a>
      </div>

      <div class="ledger" id="payouts-ledger"></div>
    </div>
  </main>

  <footer class="site-footer">
    <span>WearShare Admin</span>
  </footer>

  <script src="../api.js"></script>
  <script src="admin.js"></script>
  <script src="payouts.js"></script>
</body>
</html>
